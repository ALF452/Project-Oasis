name: Build and release APK

on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify signing secrets are configured
        run: |
          missing=()
          [ -z "${{ secrets.KEYSTORE_BASE64 }}" ] && missing+=("KEYSTORE_BASE64")
          [ -z "${{ secrets.KEYSTORE_PASSWORD }}" ] && missing+=("KEYSTORE_PASSWORD")
          [ -z "${{ secrets.KEY_ALIAS }}" ] && missing+=("KEY_ALIAS")
          [ -z "${{ secrets.KEY_PASSWORD }}" ] && missing+=("KEY_PASSWORD")
          if [ ${#missing[@]} -ne 0 ]; then
            echo "::error::Missing repository secrets: ${missing[*]}. Add them under Settings > Secrets and variables > Actions before this workflow can produce a signed, updatable APK."
            exit 1
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Decode signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          mkdir -p "$RUNNER_TEMP/keystore"
          # Strip any whitespace/newlines a copy-paste into the GitHub UI may have
          # introduced, and ignore stray non-base64 characters defensively.
          echo "$KEYSTORE_BASE64" | tr -d '[:space:]' | base64 --decode --ignore-garbage > "$RUNNER_TEMP/keystore/oasis-release.jks"

          if [ ! -s "$RUNNER_TEMP/keystore/oasis-release.jks" ]; then
            echo "::error::Decoded keystore file is empty. The KEYSTORE_BASE64 secret's value doesn't look like valid base64 — re-copy the full contents of keystore_base64.txt (one long line, no extra text) into that secret."
            exit 1
          fi

          if ! keytool -list -keystore "$RUNNER_TEMP/keystore/oasis-release.jks" -storepass "$KEYSTORE_PASSWORD" > /dev/null 2>&1; then
            echo "::error::Decoded file isn't a valid keystore, or KEYSTORE_PASSWORD doesn't match it. Re-check both secrets against the values you were given."
            exit 1
          fi

          echo "Keystore decoded and verified."

      - name: Build signed release APK
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/keystore/oasis-release.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          STEAM_API_KEY: ${{ secrets.STEAM_API_KEY }}
        run: |
          ./gradlew assembleRelease \
            -PoasisVersionCode=${{ github.run_number }} \
            -PoasisVersionName=v${{ github.run_number }}

      - name: Rename APK
        run: cp app/build/outputs/apk/release/app-release.apk app/build/outputs/apk/release/oasis.apk

      - name: Verify the release APK is signed with the expected key
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          APK="app/build/outputs/apk/release/oasis.apk"
          KEYSTORE="$RUNNER_TEMP/keystore/oasis-release.jks"

          # The in-app updater's entire "upgrade in place" design depends on
          # every release sharing one signing key — a build that silently came
          # out unsigned or signed with the wrong key would still assemble
          # fine, but would break updates (or the install itself) for anyone
          # who already has an earlier build installed. Catch that here,
          # before publishing, rather than after a user reports it.
          #
          # This has to be apksigner, not `keytool -printcert -jarfile`:
          # keytool only understands the legacy JAR signing scheme, while
          # AGP signs release APKs with the modern v2/v3 APK Signature
          # Scheme by default — keytool finds nothing there and reports the
          # APK as unsigned even when it's signed correctly. apksigner
          # understands all of v1-v4 and is the actual tool for this job.
          build_tools_dir=$(find "$ANDROID_HOME/build-tools" -maxdepth 1 -mindepth 1 -type d | sort -V | tail -n1)
          apksigner="$build_tools_dir/apksigner"
          if [ ! -x "$apksigner" ]; then
            echo "::error::Couldn't find apksigner under $ANDROID_HOME/build-tools to verify the release APK's signature."
            exit 1
          fi

          # Strip everything up to and including the last occurrence of the
          # label on the matched line, greedily — robust regardless of
          # whatever else (a "Signer #1" prefix, extra colons) precedes it,
          # unlike splitting on a fixed field separator.
          extract_apk_sha256() {
            grep -m1 'SHA-256 digest' | sed -E 's/.*SHA-256 digest:[[:space:]]*//' | tr -d ':[:space:]' | tr '[:upper:]' '[:lower:]'
          }

          apk_sign_output=$("$apksigner" verify --print-certs "$APK" 2>&1)
          apk_fp=$(printf '%s\n' "$apk_sign_output" | extract_apk_sha256)
          if [ -z "$apk_fp" ]; then
            echo "::error::apksigner couldn't verify a signature on the built APK. This almost always means the KEYSTORE_*/KEY_* secrets weren't picked up by Gradle — check they're set exactly as documented in the README, then re-run."
            echo "---- apksigner verify output ----"
            printf '%s\n' "$apk_sign_output"
            exit 1
          fi

          keystore_cert_output=$(keytool -list -v -keystore "$KEYSTORE" -alias "$ANDROID_KEY_ALIAS" -storepass "$ANDROID_KEYSTORE_PASSWORD" 2>&1)
          keystore_fp=$(printf '%s\n' "$keystore_cert_output" | grep -m1 'SHA256:' | sed -E 's/.*SHA256:[[:space:]]*//' | tr -d ':[:space:]' | tr '[:upper:]' '[:lower:]')
          if [ -z "$keystore_fp" ]; then
            echo "::error::Couldn't read a fingerprint back out of the keystore itself — this points at a bug in this verification step, not the build. Failing safe rather than skipping the check."
            echo "---- keytool -list -v output ----"
            printf '%s\n' "$keystore_cert_output"
            exit 1
          fi

          if [ "$apk_fp" != "$keystore_fp" ]; then
            echo "::error::The release APK's signing certificate doesn't match the configured keystore (APK=$apk_fp, keystore=$keystore_fp). Refusing to publish it, since it would break in-place updates for anyone with an earlier build installed."
            exit 1
          fi

          echo "Release APK is signed with the expected key ($apk_fp)."

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: Oasis v${{ github.run_number }}
          files: app/build/outputs/apk/release/oasis.apk
          generate_release_notes: true
